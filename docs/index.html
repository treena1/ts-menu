<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ts Menu</title>
  <meta name="theme-color" content="#FBF5EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ts Menu">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="banner" class="banner" hidden></div>
  <main id="view" class="view"></main>
  <nav class="tabbar" id="tabbar" aria-label="Main">
    <a href="#/home" data-tab="home" class="tab-terra"><span data-icon="home"></span><span>Home</span></a>
    <a href="#/recipes" data-tab="recipes" class="tab-olive"><span data-icon="book"></span><span>Recipes</span></a>
    <a href="#/favorites" data-tab="favorites" class="tab-mustard"><span data-icon="star"></span><span>Favorites</span></a>
    <a href="#/grocery" data-tab="grocery" class="tab-terra"><span data-icon="bag"></span><span>Grocery</span><b class="tab-badge" id="grocery-badge" hidden></b></a>
    <a href="#/pantry" data-tab="pantry" class="tab-olive"><span data-icon="jar"></span><span>Pantry</span></a>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/core.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
